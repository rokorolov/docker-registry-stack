---
-   name: Change SSH port
    hosts: all
    remote_user: root
    tasks:
        -   name: Validate new SSH port
            ansible.builtin.assert:
                that:
                    - new_ssh_port is defined
                    - new_ssh_port | string | regex_search('^[0-9]+$') is not none
                    - new_ssh_port | int >= 1024
                    - new_ssh_port | int <= 65535
                fail_msg: "new_ssh_port must be a number between 1024 and 65535. Received: {{ new_ssh_port }}"

        -   name: Get current SSH port from sshd_config
            ansible.builtin.shell: awk '/^Port\s/{print $2}' /etc/ssh/sshd_config
            register: sshd_current_port_result
            changed_when: false

        -   name: Set old port fact
            ansible.builtin.set_fact:
                old_ssh_port: "{{ sshd_current_port_result.stdout | default('22', true) }}"

        -   name: Assert new port differs from current sshd port
            ansible.builtin.assert:
                that: new_ssh_port | int != old_ssh_port | int
                fail_msg: >
                    sshd is already configured on port {{ old_ssh_port }} — no change needed.
                    If a previous run was interrupted, set ansible_port to {{ old_ssh_port }}
                    in hosts.yml and retry.

        -   name: Assert new port is not already in use by another process
            ansible.builtin.wait_for:
                port: "{{ new_ssh_port }}"
                state: absent
                timeout: 3

        -   name: Check UFW status
            ansible.builtin.command: ufw status
            register: ufw_status
            changed_when: false

        -   name: Allow new SSH port in UFW
            community.general.ufw:
                rule: allow
                port: "{{ new_ssh_port | string }}"
                proto: tcp
            when: "'Status: active' in ufw_status.stdout"

        -   name: Update SSH port in sshd_config
            ansible.builtin.lineinfile:
                path: /etc/ssh/sshd_config
                regexp: '^#?Port\s+'
                line: "Port {{ new_ssh_port }}"
                backup: yes

        -   name: Validate sshd configuration
            ansible.builtin.command: sshd -t
            changed_when: false

        -   name: Check if ssh.socket unit exists
            ansible.builtin.command: systemctl cat ssh.socket
            register: ssh_socket_exists
            changed_when: false
            failed_when: false

        -   name: Create ssh.socket drop-in directory
            ansible.builtin.file:
                path: /etc/systemd/system/ssh.socket.d
                state: directory
                mode: '0755'
            when: ssh_socket_exists.rc == 0

        -   name: Override ssh.socket ListenStream
            ansible.builtin.copy:
                # Empty ListenStream= clears the inherited value before setting the new one.
                # Explicit 0.0.0.0 and [::] ensure both IPv4 and IPv6 are covered
                # regardless of the system's net.ipv6.bindv6only setting.
                content: |
                    [Socket]
                    ListenStream=
                    ListenStream=0.0.0.0:{{ new_ssh_port }}
                    ListenStream=[::]:{{ new_ssh_port }}
                dest: /etc/systemd/system/ssh.socket.d/listen.conf
                mode: '0644'
            when: ssh_socket_exists.rc == 0

        -   name: Reload systemd daemon
            ansible.builtin.systemd:
                daemon_reload: yes

        -   name: Restart ssh.socket
            ansible.builtin.service:
                name: ssh.socket
                state: restarted
            when: ssh_socket_exists.rc == 0

        # On socket-activated systems ssh.socket manages the process lifecycle;
        # restarting ssh.service is redundant and would drop the control connection.
        -   name: Restart ssh.service
            ansible.builtin.service:
                name: ssh
                state: restarted
            when: ssh_socket_exists.rc != 0

        -   name: Verify new port is reachable
            ansible.builtin.wait_for:
                host: "{{ ansible_host }}"
                port: "{{ new_ssh_port }}"
                timeout: 30
            delegate_to: localhost
            ignore_errors: yes
            register: port_verify


        -   name: Remove old SSH port from UFW
            ansible.builtin.command: "ufw delete allow {{ old_ssh_port }}/tcp"
            register: ufw_delete_result
            changed_when: "'Rule deleted' in ufw_delete_result.stdout"
            failed_when: false
            when: "'Status: active' in ufw_status.stdout"

        -   name: Warn if port is not reachable from controller
            ansible.builtin.debug:
                msg: >
                    WARNING: port {{ new_ssh_port }} is not reachable from this machine.
                    The server is configured correctly — your VPS provider may have a
                    cloud-level firewall blocking this port. Open port {{ new_ssh_port }}/TCP
                    in your provider's control panel, then update ansible_port in hosts.yml manually.
            when: port_verify is not succeeded
            delegate_to: localhost

        -   name: Update ansible_port in hosts.yml
            ansible.builtin.lineinfile:
                path: "{{ playbook_dir }}/hosts.yml"
                regexp: '^\s+ansible_port:'
                line: "            ansible_port: {{ new_ssh_port }}"
            delegate_to: localhost
            when: port_verify is succeeded

        -   name: Report
            ansible.builtin.debug:
                msg: "SSH port changed from {{ old_ssh_port }} to {{ new_ssh_port }}. hosts.yml updated."
            delegate_to: localhost
            when: port_verify is succeeded
