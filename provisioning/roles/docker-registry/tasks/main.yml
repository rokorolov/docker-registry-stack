---
-   name: Validate required variables
    ansible.builtin.assert:
        that:
            - registry_domain is defined and registry_domain | length > 0
            - cache_registry_domain is defined and cache_registry_domain | length > 0
            - acme_email is defined and acme_email | length > 0
        fail_msg: >
            registry_domain, cache_registry_domain and acme_email must be set in inventory (e.g. hosts.yml all.vars)

-   import_tasks: deploy_caddy_config.yml

-   import_tasks: remove_certbot.yml
