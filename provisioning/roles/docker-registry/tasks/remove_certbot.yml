---
# Caddy manages certificates itself; these tasks remove the Certbot setup
# left behind by installs that predate the Caddy migration.
-   name: Remove legacy Certbot setup
    become: true
    block:
        -   name: Remove temporary ACME Apache container
            ansible.builtin.command: docker rm -f apache
            register: apache_rm
            changed_when: apache_rm.rc == 0
            failed_when: false

        -   name: Remove Certbot renewal cron job
            ansible.builtin.cron:
                name: Certbot automatic renewal.
                state: absent

        -   name: Purge Certbot package
            ansible.builtin.apt:
                name: certbot
                state: absent
                purge: true

        -   name: Remove Certbot and nginx config directories
            ansible.builtin.file:
                path: "{{ item }}"
                state: absent
            loop:
                - /etc/letsencrypt
                - /etc/docker-registry/nginx
