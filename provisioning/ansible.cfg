[defaults]
interpreter_python = auto_silent
host_key_checking = False
retry_files_enabled = False

[ssh_connection]
# ~/.ssh is mounted read-only from the host. SSH refuses config files it doesn't
# own (-F /dev/null) and cannot write to known_hosts, so we redirect it to
# /dev/null to prevent the read-only write failure that breaks sshpass auth.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -F /dev/null -o UserKnownHostsFile=/dev/null
