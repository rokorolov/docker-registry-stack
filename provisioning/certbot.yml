---
-   name: Set Up certbot
    hosts: all
    remote_user: root
    vars:
        certbot_create_method: 'webroot'
        certbot_create_if_missing: true
        certbot_certs:
            -   domains:
                    - "{{ registry_domain }}"
                webroot: "/var/www/html/"
            -   domains:
                    - "{{ cache_registry_domain }}"
                webroot: "/var/www/html/"

    pre_tasks:
        -   name: Verify DNS records resolve to this server
            ansible.builtin.shell: |
                resolved=$(getent hosts {{ item }} | awk '{print $1}')
                if [ "$resolved" != "{{ ansible_default_ipv4.address }}" ]; then
                    echo "{{ item }} resolves to '${resolved}', expected {{ ansible_default_ipv4.address }}"
                    exit 1
                fi
            loop:
                - "{{ registry_domain }}"
                - "{{ cache_registry_domain }}"
            changed_when: false

        -   name: Update apt cache.
            ansible.builtin.apt:
                update_cache: yes
                cache_valid_time: 600
            changed_when: false

        -   name: Install cron (Debian).
            ansible.builtin.apt:
                name: cron
                state: present

        -   name: Check if server is running
            ansible.builtin.wait_for:
                port: 80
                timeout: 1
            register: port_check
            ignore_errors: yes

        -   name: Start temporary Apache container for ACME challenge
            ansible.builtin.shell: "docker run -d --name apache -v /var/www/html:/usr/local/apache2/htdocs/ -p 80:80 httpd:2.4"
            when: port_check is defined and port_check.failed

    post_tasks:
        -   name: Remove temporary Apache container
            ansible.builtin.shell: "docker rm -f apache"
            when: port_check is defined and port_check.failed
            ignore_errors: yes

    roles:
        - geerlingguy.certbot
