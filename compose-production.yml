services:
    caddy:
        image: caddy:2.11.6-alpine
        restart: always
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            # Directory mount: Ansible replaces the Caddyfile atomically, which a
            # single-file bind mount would not pick up.
            - /etc/docker-registry/caddy:/etc/caddy:ro
            - ./users:/etc/caddy-auth/users:ro
            - caddy_data:/data
            - caddy_config:/config
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        depends_on:
            registry:
                condition: service_healthy
            cache-registry:
                condition: service_healthy
        networks:
            - registry-net
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    registry:
        image: registry:3.1.2
        restart: always
        environment:
            REGISTRY_LOG_LEVEL: info
            # Optional: set in ~/registry/.env on the server to suppress the startup warning.
            REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET:-}
        volumes:
            - registry:/var/lib/registry
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/v2/ || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        networks:
            - registry-net
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    cache-registry:
        image: registry:3.1.2
        restart: always
        environment:
            REGISTRY_LOG_LEVEL: info
            REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
            REGISTRY_PROXY_TTL: 168h
            REGISTRY_STORAGE_DELETE_ENABLED: "true"
            # Optional: set in ~/registry/.env on the server to bypass Docker Hub rate limits.
            REGISTRY_PROXY_USERNAME: ${REGISTRY_PROXY_USERNAME:-}
            REGISTRY_PROXY_PASSWORD: ${REGISTRY_PROXY_PASSWORD:-}
            REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET:-}
        volumes:
            - cache-registry:/var/lib/registry
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/v2/ || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        networks:
            - registry-net
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

volumes:
    registry:
    cache-registry:
    caddy_data:
    caddy_config:

networks:
    registry-net:
        driver: bridge
